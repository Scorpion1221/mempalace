
# LiteLLM proxy config for MemPalace
#
# Exposes an OpenAI-compatible endpoint on :4000 that MemPalace uses for:
#   - Embedding  (Gemini gemini-embedding-2-preview, 3072 dims)
#   - Recall LLM (Gemini 3.1 Flash Lite — recall rewrite + rerank + save extraction)
#
# Matches the defaults in scripts/mempalace-env.template:
#   MEMPAL_EMBEDDING_ENDPOINT=http://127.0.0.1:4000
#   MEMPAL_LLM_ENDPOINT=http://127.0.0.1:4000/v1
#   MEMPAL_*_KEY=sk-litellm-local   (the master_key below)
#
# ─── Backend selection ──────────────────────────────────────────────────────
# Two ways to reach Gemini. Uncomment ONE pair and comment out the other.
#
#   (A) Gemini API — simplest. Requires GEMINI_API_KEY in litellm/.env.
#       Get a key at https://aistudio.google.com/apikey
#
#   (B) Vertex AI — for orgs already on Vertex. Requires
#       VERTEXAI_PROJECT + VERTEXAI_LOCATION in litellm/.env, and a
#       `vertex_credentials` path in the uncommented vertex_ai/* entries below.
#       Use a local service-account JSON file path, e.g.
#         vertex_credentials: /path/to/vertex-service-account.json
#
# The dimension warning at the bottom applies to BOTH backends.

model_list:
  # MemPalace only needs two models: an embedding model (for vector storage)
  # and a small/cheap LLM (for save extraction + recall rewrite/rerank).
  # No need to expose gemini-2.5-flash / gemini-2.5-pro — those are for
  # general-purpose chat, not the mempalace pipeline.
  #
  # ─── (A) Gemini API backend — DISABLED, using Vertex AI instead ─────────
  # - model_name: gemini-embedding-2-preview
  #   litellm_params:
  #     model: gemini/gemini-embedding-001
  #     api_key: os.environ/GEMINI_API_KEY
  #     output_dimensionality: 3072
  #
  # - model_name: gemini-3.1-flash-lite-preview
  #   litellm_params:
  #     model: gemini/gemini-2.5-flash-lite
  #     api_key: os.environ/GEMINI_API_KEY

  # ─── (B) Vertex AI backend — ACTIVE ─────────────────────────────────────
  # Model IDs below match the real Vertex AI Gemini preview endpoints.
  # `vertex_credentials` is the local path to a service-account JSON key
  # readable by the proxy process (or the container, if you mount it in).
  - model_name: gemini-embedding-2-preview
    litellm_params:
      model: vertex_ai/gemini-embedding-2-preview
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: os.environ/VERTEXAI_LOCATION
      vertex_credentials: /path/to/vertex-service-account.json
      output_dimensionality: 3072

  - model_name: gemini-3.1-flash-lite-preview
    litellm_params:
      model: vertex_ai/gemini-3.1-flash-lite-preview
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: os.environ/VERTEXAI_LOCATION
      vertex_credentials: /path/to/vertex-service-account.json

litellm_settings:
  drop_params: true
  cache: true
  cache_params:
    type: local
    ttl: 86400  # 24h — embedding of the same text hits cache

general_settings:
  # Master key — clients authenticate as Bearer sk-litellm-local.
  # Change this to something random in production, and update ~/.mempalace/env.
  master_key: sk-litellm-local

# ─── Dimension warning ──────────────────────────────────────────────────────
# MemPalace stores embeddings in ChromaDB with a fixed dimensionality. The
# palace is initialised with whatever dimension the first embedding call
# returns. Changing `output_dimensionality` after the palace exists will
# silently break every upsert — ChromaDB rejects vectors with the wrong dim.
# If you must change it, wipe ~/.mempalace/palace/ and re-ingest.
