services:
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.55.0-stable
    container_name: mempalace-litellm
    restart: unless-stopped
    ports:
      # Localhost-only — the master_key is a convenience, not a real secret,
      # and the upstream Gemini/Vertex credentials are worth protecting.
      - "127.0.0.1:4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # Mount host gcloud config so Vertex AI ADC works without baking a
      # service-account key into the image. Ignored by backend (A).
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
    env_file:
      - .env
    command: --config /app/config.yaml --port 4000 --num_workers 2
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:4000/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
