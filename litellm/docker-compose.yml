services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: mempalace-litellm
    restart: unless-stopped
    ports:
      # Localhost-only — the master_key is a convenience, not a real secret,
      # and the upstream Gemini/Vertex credentials are worth protecting.
      - "127.0.0.1:4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # Vertex AI auth in this repo is configured per-model via
      # `vertex_credentials: /path/to/vertex-service-account.json` in
      # config.yaml. If that path lives outside the container, mount it in
      # read-only here, e.g.:
      #   - /host/path/vertex-service-account.json:/secrets/vertex.json:ro
      # and set `vertex_credentials: /secrets/vertex.json` in config.yaml.
      # The gcloud ADC mount below is optional (legacy) and ignored by the
      # Gemini API backend.
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
    env_file:
      - .env
    command: --config /app/config.yaml --port 4000 --num_workers 2
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:4000/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
