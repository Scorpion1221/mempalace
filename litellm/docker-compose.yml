services:
  litellm:
    # Pin a stable tag so `docker compose pull` doesn't silently swap the proxy.
    image: ghcr.io/berriai/litellm:main-v1.55.0-stable
    container_name: mempalace-litellm
    restart: unless-stopped
    ports:
      # Bind to localhost only — this proxy has an API key and should not
      # be reachable from the LAN.
      - "127.0.0.1:4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    env_file:
      - .env
    command: --config /app/config.yaml --port 4000 --num_workers 2
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:4000/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
